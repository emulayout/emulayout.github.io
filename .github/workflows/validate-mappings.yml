name: Validate mappings

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-mappings-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mapping files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emulayout
        uses: actions/checkout@v7

      - name: Checkout Cmini layouts
        uses: actions/checkout@v7
        with:
          repository: Apsu/cmini
          path: .cache/cmini-repo
          sparse-checkout: layouts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate mappings
        run: bun run validate:mappings
