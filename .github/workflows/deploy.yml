name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    # After cmini (~5pm PT) and cminibrowser (~7pm PT). 04:15 UTC is 8:15pm PST / 9:15pm PDT.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Bun + node_modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      - name: Test
        run: bun test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Cache cmini repo + cminibrowser dumps + catalog artifacts
        uses: actions/cache@v6
        with:
          path: |
            .cache/cmini-repo
            .cache/cminibrowser
            .cache/layout-timestamps.json
            .cache/cmini-synced-head
            static/all-layouts.json
            static/layout-supplemental.json
            static/authors.json
            static/layout-likes.json
            static/layout-stats-cyanophage.json
            static/layout-stats-cmini-*.json
            static/layout-stats-mana2-*.json
          key: ${{ runner.os }}-cmini-v11-${{ hashFiles('bin/catalog-sync.js', 'bin/cmini-stats-sync.js', 'bin/mana2-stats-sync.js', 'bin/cyanophage-stats-sync.js', 'bin/sync-shared.js', 'bin/cminibrowser-cache.js', 'bin/cminibrowser-cmini-stats.js', 'bin/cminibrowser-mana2-stats.js', 'bin/stats-artifact-paths.js', 'bin/layout-data.js', 'bin/input-mapping-validation.js', 'bin/layout-features.js', 'bin/layout-codec.js', 'bin/layout-transformer.js', 'bin/layout-timestamps.js', 'bin/cmini-analyzer.js', 'bin/cmini-data/**', 'bin/cyanophage-stats.js', 'bin/cyanophage-data/**', 'adaptive-layouts.txt', 'data/layouts/**', 'src/lib/magicKeys.ts', 'src/lib/adaptiveSwaps.ts', 'src/lib/layoutSupplemental.ts', 'src/lib/layoutDisplay.ts', 'src/lib/cyanophage.ts', 'src/lib/statsDerivation.ts', 'src/lib/statsAnalyzers.ts') }}
          restore-keys: |
            ${{ runner.os }}-cmini-

      - name: Sync catalog
        id: catalog
        run: bun run ./bin/catalog-sync.js
        env:
          CI: true
          # Scheduled runs skip the catalog rebuild when cmini HEAD is unchanged.
          # Pushes always rebuild so curated supplemental data stays fresh.
          CATALOG_SYNC_SKIP_IF_UNCHANGED: ${{ github.event_name == 'schedule' && '1' || '' }}

      - name: Sync cmini stats
        run: bun run ./bin/cmini-stats-sync.js
        env:
          CI: true

      - name: Sync Cyanophage stats
        run: bun run ./bin/cyanophage-stats-sync.js
        env:
          CI: true
          CYANOPHAGE_SKIP_IF_CMINI_UNCHANGED: ${{ github.event_name == 'schedule' && '1' || '' }}
          CMINI_CHANGED: ${{ steps.catalog.outputs.cmini_changed }}

      - name: Sync Mana2 stats
        run: bun run ./bin/mana2-stats-sync.js
        env:
          CI: true

      - name: Build
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
